[package]
name = "ai-workload-monitor"
version = "0.1.0"
description = "Local Linux system monitor for AI workloads"
authors = ["Jayanta Paul"]
license = "MIT"
repository = "https://github.com/jayantapaul-18/ai-workload-monitor"
readme = "../README.md"
keywords = ["system-monitor", "gpu", "ollama", "tauri"]
categories = ["gui"]
edition = "2021"

[lib]
name = "ai_workload_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tokio = { version = "1", features = ["time"] }
ureq = "2"
dirs = "6"
